name: ci

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: unit tests
        run: python -m unittest discover -s tests -v
      - name: agent imports cleanly
        run: python -c "import sys; sys.path.insert(0, 'agent'); import gpumaid, gpumaid.cli, gpumaid.server; print('ok')"
      - name: tray script parses (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errs = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'tray/gpu-maid-tray.ps1'), [ref]$null, [ref]$errs)
          if ($errs.Count) { $errs | ForEach-Object { $_.Message }; exit 1 }

  macos-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: menu-bar app compiles
        run: swiftc -O desktop/macos/gpumaid-bar.swift -o /tmp/gpumaid-bar

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npx --yes markdownlint-cli2 "**/*.md"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: menubar plugin syntax
        run: python -m py_compile "menubar/gpu-maid.5s.py"
