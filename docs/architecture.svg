<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <style>
    .panel{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1.5}
    .chip{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
    .txt{fill:#24292f}
    .sub{fill:#57606a}
    .accent{stroke:#8250df;stroke-width:1.5}
    .dot-run{fill:#1a7f37}
    .dot-slp{fill:#9a6700}
    .dot-wake{fill:#d29922}
    .arrow{stroke:#7a828b;stroke-width:2;fill:none}
    @media (prefers-color-scheme: dark){
      .panel{fill:#161b22;stroke:#30363d}
      .chip{fill:#0d1117;stroke:#30363d}
      .txt{fill:#e6edf3}
      .sub{fill:#8b949e}
      .accent{stroke:#ab7df8}
      .dot-run{fill:#3fb950}
      .dot-slp{fill:#8b949e}
      .dot-wake{fill:#d29922}
    }
  </style>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#7a828b"/>
    </marker>
  </defs>

  <!-- left: client -->
  <rect x="20" y="170" width="200" height="190" rx="14" class="panel"/>
  <text x="120" y="206" text-anchor="middle" font-size="16" font-weight="700" class="txt">Client · your Mac</text>
  <text x="44" y="246" font-size="13" class="txt">gpu-maid CLI</text>
  <text x="44" y="278" font-size="13" class="txt">hub / scripts</text>
  <text x="44" y="310" font-size="13" class="txt">any HTTP client</text>

  <!-- middle: agent -->
  <rect x="300" y="60" width="350" height="400" rx="14" class="panel"/>
  <text x="475" y="96" text-anchor="middle" font-size="17" font-weight="700" class="txt">gpu-maid agent</text>
  <text x="475" y="117" text-anchor="middle" font-size="12" class="sub">Windows · native (no WSL2, no Docker)</text>

  <rect x="320" y="130" width="310" height="46" rx="9" class="chip accent"/>
  <text x="336" y="149" font-size="13" font-weight="700" class="txt">HTTP API</text>
  <text x="336" y="167" font-size="11.5" class="sub">the only door — JSON in, JSON out</text>

  <rect x="320" y="184" width="310" height="46" rx="9" class="chip"/>
  <text x="336" y="203" font-size="13" font-weight="700" class="txt">Resident registry</text>
  <text x="336" y="221" font-size="11.5" class="sub">who lives here, how to wake each one</text>

  <rect x="320" y="238" width="310" height="46" rx="9" class="chip"/>
  <text x="336" y="257" font-size="13" font-weight="700" class="txt">VRAM gate</text>
  <text x="336" y="275" font-size="11.5" class="sub">every job asks first; residents vacate politely</text>

  <rect x="320" y="292" width="310" height="46" rx="9" class="chip"/>
  <text x="336" y="311" font-size="13" font-weight="700" class="txt">Wake &amp; cooldown</text>
  <text x="336" y="329" font-size="11.5" class="sub">loading models are never re-poked</text>

  <rect x="320" y="346" width="310" height="46" rx="9" class="chip"/>
  <text x="336" y="365" font-size="13" font-weight="700" class="txt">Watchdog</text>
  <text x="336" y="383" font-size="11.5" class="sub">silent deaths get noticed, then revived</text>

  <rect x="320" y="400" width="310" height="46" rx="9" class="chip"/>
  <text x="336" y="419" font-size="13" font-weight="700" class="txt">Master switch</text>
  <text x="336" y="437" font-size="11.5" class="sub">hang up the whole house on demand</text>

  <!-- right: residents -->
  <rect x="730" y="80" width="210" height="380" rx="14" class="panel"/>
  <text x="835" y="114" text-anchor="middle" font-size="16" font-weight="700" class="txt">Residents</text>
  <text x="835" y="133" text-anchor="middle" font-size="12" class="sub">one consumer GPU</text>

  <rect x="745" y="150" width="180" height="58" rx="9" class="chip"/>
  <circle cx="762" cy="172" r="5" class="dot-slp"/>
  <text x="776" y="177" font-size="13" class="txt">LLM · Ollama</text>
  <text x="776" y="197" font-size="11" class="sub">sleeping · 0 GB</text>

  <rect x="745" y="220" width="180" height="58" rx="9" class="chip"/>
  <circle cx="762" cy="242" r="5" class="dot-slp"/>
  <text x="776" y="247" font-size="13" class="txt">TTS voice</text>
  <text x="776" y="267" font-size="11" class="sub">sleeping · 0 GB</text>

  <rect x="745" y="290" width="180" height="58" rx="9" class="chip"/>
  <circle cx="762" cy="312" r="5" class="dot-run"/>
  <text x="776" y="317" font-size="13" class="txt">Image · ComfyUI</text>
  <text x="776" y="337" font-size="11" class="sub">running · 8 GB</text>

  <rect x="745" y="360" width="180" height="58" rx="9" class="chip"/>
  <circle cx="762" cy="382" r="5" class="dot-wake"/>
  <text x="776" y="387" font-size="13" class="txt">Video line</text>
  <text x="776" y="407" font-size="11" class="sub">waking up…</text>

  <!-- arrows -->
  <line x1="222" y1="265" x2="294" y2="265" class="arrow" marker-end="url(#ah)"/>
  <text x="258" y="244" text-anchor="middle" font-size="11" class="sub">LAN /</text>
  <text x="258" y="258" text-anchor="middle" font-size="11" class="sub">Tailscale</text>

  <line x1="652" y1="265" x2="724" y2="265" class="arrow" marker-end="url(#ah)"/>
  <text x="688" y="244" text-anchor="middle" font-size="11" class="sub">wake · sleep</text>
  <text x="688" y="258" text-anchor="middle" font-size="11" class="sub">health check</text>

  <!-- caption -->
  <text x="480" y="522" text-anchor="middle" font-size="13" class="sub">One consumer GPU, several AI residents —</text>
  <text x="480" y="544" text-anchor="middle" font-size="13" font-weight="700" class="txt">she decides who runs, who sleeps, who gets woken.</text>
</svg>
